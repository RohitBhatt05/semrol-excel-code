name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: gradle

      - name: Prepare Web Assets & Sync Capacitor
        run: |
          npm install
          mkdir -p www
          cp index.html style.css app.js papaparse.min.js manifest.json icon-192.png icon-512.png www/ || true
          [ -f user-icon.jpg ] && cp user-icon.jpg www/ || true
          npx cap sync android

      - name: Create Production Keystore & Build Release APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          if [ ! -f app/release.keystore ]; then
            keytool -genkeypair -v -keystore app/release.keystore \
              -alias bhupendragupta -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "BhupendraApp2026@" -keypass "BhupendraApp2026@" \
              -dname "CN=Bhupendra Gupta, OU=Trading, O=Semrol, L=Delhi, C=IN"
          fi
          ./gradlew assembleRelease --stacktrace

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Bhupendra-Gupta-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error