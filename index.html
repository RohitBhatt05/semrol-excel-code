<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description"
    content="NSE Option Chain Scanner — Upload CSV files to instantly calculate CALLS and PUTS column totals, date-wise breakdowns and combined grand totals." />
  <meta name="theme-color" content="#0b0e1a" />

  <!-- PWA: Make it installable on Android (Add to Home Screen) -->
  <link rel="manifest" href="manifest.json" />

  <!-- iOS Safari PWA support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MPCUKBJKR" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <title>MPCUKBJKR</title>
  <link rel="stylesheet" href="style.css" />

  <!-- PapaParse bundled locally — works 100% offline after first load -->
  <script src="papaparse.min.js"></script>
</head>

<body>

  <!-- ══ STICKY HEADER ══ -->
  <header class="app-header" role="banner">
    <div class="header-inner">
      <div class="app-logo">
        <img src="icon-192.png" alt="MPCUKBJKR Logo" class="logo-img" />
        <div class="logo-text-group">
          <span class="logo-text">MPCUKBJKR</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="clearBtn" class="btn btn-clear" title="Clear all files" aria-label="Clear all files">
          <span class="clear-icon">🗑️</span>
          <span class="clear-text">Clear</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ══ INSTALL BANNER (shown only when PWA is installable) ══ -->
  <div class="install-banner" id="installBanner" style="display:none">
    <span>📲 Install as App — tap to add to your Home Screen</span>
    <button id="installBtn" class="btn btn-install">Install</button>
    <button id="dismissInstall" class="btn-icon" aria-label="Dismiss">✕</button>
  </div>

  <!-- ══ MAIN ══ -->
  <main class="app-main" role="main">

    <!-- ═══ EXCHANGE API BUTTONS (NSE / BSE) ═══ -->
    <section class="exchange-section" aria-label="Exchange API Selection">
      <div class="exchange-card">
        <div class="exchange-buttons-row">
          <button type="button" id="btnNse" class="btn-exchange" data-exchange="NSE" title="Load NSE Option Chain data">
            <span class="exchange-icon">📈</span>
            <div class="exchange-info">
              <span class="exchange-title">NSE</span>
              <span class="exchange-sub">NIFTY Option Chain</span>
            </div>
            <span class="exchange-badge">API</span>
          </button>
          
          <button type="button" id="btnBse" class="btn-exchange" data-exchange="BSE" title="Load BSE Option Chain data">
            <span class="exchange-icon">🏛️</span>
            <div class="exchange-info">
              <span class="exchange-title">BSE</span>
              <span class="exchange-sub">SENSEX Option Chain</span>
            </div>
            <span class="exchange-badge">API</span>
          </button>
        </div>

        <!-- ═══ DYNAMIC EXCHANGE FILTERS PANEL (Symbol & Expiry Dropdowns) ═══ -->
        <div id="exchangeFiltersPanel" class="exchange-filters-panel" style="display:none">
          <div class="filters-header">
            <div class="filters-header-left">
              <span class="filter-step-icon">⚡</span>
              <span id="filtersHeading" class="filters-heading">NSE Option Chain Filters</span>
              <span id="apiStatusBadge" class="api-status-badge"></span>
            </div>
            <div class="filters-header-right">
              <button type="button" id="btnClearExchangeData" class="btn-date-action" title="Clear all calculated totals for this exchange">Clear Table</button>
            </div>
          </div>

          <!-- Filter Controls Grid -->
          <div class="filters-controls-grid">
            <!-- View Options Contracts for / Instrument Type -->
            <div class="filter-group" id="indexGroup">
              <label for="indexSelect" class="filter-label" id="indexSelectLabel">
                View Options Contracts for:
              </label>
              <div class="select-wrapper">
                <select id="indexSelect" class="filter-select" aria-label="View Options Contracts for">
                  <option value="">Select</option>
                </select>
              </div>
            </div>

            <!-- OR Divider 1 -->
            <div class="filter-or-divider" id="dividerOr1" aria-hidden="true">OR</div>

            <!-- Select Symbol / Underlying Asset -->
            <div class="filter-group" id="symbolGroup">
              <label for="symbolSelect" class="filter-label" id="symbolSelectLabel">
                Select Symbol:
              </label>
              <div class="select-wrapper">
                <select id="symbolSelect" class="filter-select" aria-label="Select Symbol">
                  <option value="">Select</option>
                </select>
                <div class="select-loader" id="symbolLoader" style="display:none"></div>
              </div>
            </div>

            <!-- Expiry Date (Multi-Select with checkboxes) -->
            <div class="filter-group multiselect-group" id="expiryGroup">
              <label class="filter-label" id="expiryLabel">
                Expiry Date:
              </label>
              <div class="select-wrapper multiselect-wrapper" id="expiryMultiselectWrapper">
                <button type="button" id="expiryMultiBtn" class="filter-select multiselect-btn" aria-haspopup="listbox" aria-expanded="false" disabled>
                  <span id="expiryMultiText">Select Expiry Date</span>
                  <span class="multiselect-badge" id="expiryMultiBadge" style="display:none">0</span>
                </button>
                <div class="multiselect-dropdown" id="expiryDropdown" style="display:none" role="listbox">
                  <div class="multiselect-actions">
                    <button type="button" class="btn-ms-action" id="btnSelectAllExpiries">Select All</button>
                    <span class="ms-action-sep">·</span>
                    <button type="button" class="btn-ms-action" id="btnClearExpiries">Clear</button>
                  </div>
                  <div class="multiselect-list" id="expiryCheckboxesList">
                    <!-- Populated dynamically with checkboxes -->
                  </div>
                </div>
                <div class="select-loader" id="expiryLoader" style="display:none"></div>
              </div>
            </div>

            <!-- OR Divider 2 -->
            <div class="filter-or-divider" id="dividerOr2" aria-hidden="true">OR</div>

            <!-- Strike Price Filter -->
            <div class="filter-group" id="strikeGroup">
              <label for="strikeSelect" class="filter-label" id="strikeSelectLabel">
                Strike Price:
              </label>
              <div class="select-wrapper">
                <select id="strikeSelect" class="filter-select" aria-label="Strike Price" disabled>
                  <option value="">Select</option>
                </select>
                <div class="select-loader" id="strikeLoader" style="display:none"></div>
              </div>
            </div>

            <!-- Step 3: Fetch Totals Action Button -->
            <div class="filter-group filter-action-group">
              <label class="filter-label">&nbsp;</label>
              <button type="button" id="btnFetchTotals" class="btn-fetch-totals" disabled title="Fetch Option Chain Data and Calculate Totals">
                <span class="fetch-btn-icon">📊</span>
                <span id="btnFetchText">Fetch Totals</span>
              </button>
            </div>
          </div>

          <!-- Progress / Status Indicator -->
          <div id="filterStatusMsg" class="filter-status-msg" style="display:none">
            <div class="spinner-small" id="filterStatusSpinner" style="display:none"></div>
            <span id="filterStatusText"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- Upload Zone -->
    <section class="upload-section" aria-label="File Upload">
      <div class="upload-zone" id="uploadZone" role="button" tabindex="0"
        aria-label="Drop CSV files here or tap to browse">
        <span class="upload-icon" aria-hidden="true">📥</span>
        <!-- <h1 class="upload-title">Upload NSE Option Chain CSV Files</h1>
        <p class="upload-subtitle">
          Upload <strong>1 to 7+ CSV files</strong> — each file is calculated as one date row with column totals
        </p> -->
        <button id="browseBtn" class="upload-btn" type="button">📂 Upload CSV Files</button>
        <input type="file" id="fileInput" accept=".csv,text/csv,text/plain,application/vnd.ms-excel,*/*" multiple
          aria-label="CSV file input" />
        <div class="file-chip-list" id="fileChips" aria-live="polite"></div>
      </div>
    </section>

    <!-- Stats Bar -->
    <section class="stats-bar" id="statsBar" aria-label="Summary stats" style="display:none"></section>

    <!-- ═══ DATE-WISE SUMMARY TABLE ═══ -->
    <section id="summarySection" aria-label="Date-wise summary table" aria-live="polite"></section>

  </main>

  <!-- ══ BOTTOM BAR ══ -->
  <div class="bottom-bar" id="bottomBar" role="complementary">
    <div class="bottom-bar-inner">
      <div class="bottom-stat ba">
        <span class="bl">Files</span>
        <span class="bv" id="bbFiles">0</span>
      </div>
      <div class="bsep"></div>
      <div class="bottom-stat">
        <span class="bl">Strikes</span>
        <span class="bv" id="bbStrikes">0</span>
      </div>
      <div class="bsep"></div>
      <div class="bottom-stat bc">
        <span class="bl">CALLS OI</span>
        <span class="bv" id="bbCallsOI">0</span>
      </div>
      <div class="bsep"></div>
      <div class="bottom-stat bp">
        <span class="bl">PUTS OI</span>
        <span class="bv" id="bbPutsOI">0</span>
      </div>
      <div class="bsep"></div>
      <div class="bottom-stat" style="color:var(--grand-light)">
        <span class="bl">PCR</span>
        <span class="bv" id="bbPCR" style="color:var(--grand-light)">—</span>
      </div>
      <button id="clearBtnBar" class="btn btn-danger">🗑️ Clear</button>
    </div>
  </div>

  <script src="exchange-seed.js"></script>
  <script src="app.js"></script>

  <!-- ══ PWA: Service Worker Registration ══ -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('✅ SW registered:', reg.scope))
          .catch(err => console.warn('SW registration failed:', err));
      });
    }

    // Android Chrome "Add to Home Screen" prompt
    let deferredPrompt;
    const installBanner = document.getElementById('installBanner');
    const installBtn = document.getElementById('installBtn');
    const dismissBtn = document.getElementById('dismissInstall');

    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredPrompt = e;
      installBanner.style.display = 'flex';
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBanner.style.display = 'none';
      console.log('Install outcome:', outcome);
    });

    dismissBtn.addEventListener('click', () => {
      installBanner.style.display = 'none';
    });

    // Already installed — hide banner
    window.addEventListener('appinstalled', () => {
      installBanner.style.display = 'none';
      deferredPrompt = null;
    });
  </script>
</body>

</html>
